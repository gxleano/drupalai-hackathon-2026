entity.ai_content_validation_item.settings:
  path: 'admin/structure/ai-content-validation-item'
  defaults:
    _form: '\Drupal\ai_content_validation\Form\AiValidationsSettingsForm'
    _title: 'AI Validations'
  requirements:
    _permission: 'administer ai_content_validation_item'
ai_content_validation.settings:
  path: '/admin/config/system/ai_content_validation/settings'
  defaults:
    _title: 'Settings'
    _form: 'Drupal\ai_content_validation\Form\SettingsForm'
  requirements:
    _permission: 'administer site configuration'

ai_content_validation.node_review:
  path: '/node/{node}/ai-review'
  defaults:
    _title: 'AI Validation'
    _form: '\Drupal\ai_content_validation\Form\AiReviewForm'
  requirements:
    _permission: 'create flowdrop_session'
    _entity_access: 'node.update'
    node: \d+
  options:
    parameters:
      node:
        type: 'entity:node'

ai_content_validation.main_dashboard:
  path: '/admin/ai-content-validation/main-dashboard'
  defaults:
    _title: 'Validation Dashboard'
    _controller: '\Drupal\ai_content_validation\Controller\MainDashboard'
  requirements:
    _permission: 'administer site configuration'

ai_content_validation.node_validation_state:
  path: '/node/{node}/ai-validation-state'
  defaults:
    _controller: '\Drupal\ai_content_validation\Controller\ValidationState::freshness'
  requirements:
    _permission: 'create flowdrop_session'
    _entity_access: 'node.update'
    node: \d+
  options:
    parameters:
      node:
        type: 'entity:node'
