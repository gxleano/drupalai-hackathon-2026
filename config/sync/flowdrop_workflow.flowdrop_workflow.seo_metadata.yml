id: seo_metadata
label: 'SEO & Metadata'
description: 'AI-powered workflow to generate article content with SEO-optimized meta titles and descriptions'
nodes:
  -
    id: chat_input.1
    position:
      x: 80
      'y': 120
    data:
      label: 'Chat Input'
      config:
        nodeType: simple
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: chat_input
      extensions:
        ui:
          hideUnconnectedHandles: true
    measured:
      width: 288
      height: 103
  -
    id: flowdrop_ai_provider_chat.1
    position:
      x: 570
      'y': -90
    data:
      label: Chat
      config:
        model: mistral-large-latest
        temperature: 0.7
        maxTokens: 1000
        systemPrompt: |-
          CRITICAL INSTRUCTIONS - READ CAREFULLY:

          1. You MUST output ONLY pure JSON - NO markdown, NO code fences, NO backticks, NO explanations
          2. Start your response with { and end with }
          3. Do NOT wrap your response in ```json or ```
          4. Output the JSON directly as plain text

          TASK:
          Generate high-quality article content based on user's message with 3 well-structured paragraphs (engaging intro, informative main content, strong conclusion) and SEO-optimized metadata.

          REQUIRED JSON STRUCTURE (use actual content, not placeholders):
          {"title":"Article title here","field_body":[{"value":"<p>Paragraph 1</p><p>Paragraph 2</p><p>Paragraph 3</p>","summary":"One sentence summary","format":"content_format"}],"field_metatags":[{"value":"{\"title\":\"SEO title 50-60 chars\",\"description\":\"SEO description 150-160 chars\"}"}],"meta_title":"SEO title 50-60 chars","meta_description":"SEO description 150-160 chars"}

          CRITICAL FIELD NAMES AND STRUCTURE:
          - title: REQUIRED, non-empty string (article title)
          - field_body: REQUIRED array with one object containing value, summary, format
          - field_body[0].value: HTML with <p> tags (will be displayed as plain text in preview)
          - field_body[0].summary: Brief one-sentence overview
          - field_body[0].format: MUST be "content_format" (exactly this string)
          - field_metatags: REQUIRED array for Drupal (with nested JSON string)
          - field_metatags[0].value: JSON string with title and description (use \" for inner quotes)
          - meta_title: REQUIRED string (same as field_metatags title), 50-60 characters, SEO-focused
          - meta_description: REQUIRED string (same as field_metatags description), 150-160 characters with keywords
          - Note: meta_title and meta_description are duplicates for easy preview display
          - Use double quotes, escape inner quotes with \"
          - Compact format (no line breaks in JSON)

          EXAMPLE OUTPUT (copy this EXACT structure):
          {"title":"Understanding the European Commission's Role in EU Policy","field_body":[{"value":"<p>The European Commission serves as the executive branch of the European Union, responsible for proposing legislation, implementing decisions, and managing day-to-day EU operations.</p><p>With 27 Commissioners representing each member state, the Commission drafts new EU laws, enforces regulations, and manages the EU budget. It acts as guardian of EU treaties.</p><p>Through its directorates-general, the Commission shapes policies affecting over 450 million EU citizens, from trade to environment and digital transformation.</p>","summary":"Learn about the European Commission's key role in EU governance and policy-making.","format":"content_format"}],"field_metatags":[{"value":"{\"title\":\"European Commission: Role, Powers & EU Policy Impact\",\"description\":\"Discover how the European Commission shapes EU policy and legislation. Learn about its structure, powers, and impact on member states.\"}"}],"meta_title":"European Commission: Role, Powers & EU Policy Impact","meta_description":"Discover how the European Commission shapes EU policy and legislation. Learn about its structure, powers, and impact on member states."}
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: flowdrop_ai_provider_chat
      extensions:
        ui:
          hideUnconnectedHandles: true
    measured:
      width: 288
      height: 330
  -
    id: json_to_data.1
    position:
      x: 1070
      'y': -140
    data:
      label: 'JSON to Data'
      config:
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: json_to_data
      extensions:
        ui:
          hideUnconnectedHandles: true
    measured:
      width: 288
      height: 330
  -
    id: chat_output.1
    position:
      x: 2070
      'y': -110
    data:
      label: 'Chat Output'
      config:
        format: markdown
        showTimestamp: false
        nodeType: simple
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: chat_output
      extensions:
        ui:
          hideUnconnectedHandles: true
    measured:
      width: 288
      height: 88
  -
    id: prompt_template.1
    position:
      x: 1680
      'y': -120
    data:
      label: 'Prompt Template'
      config:
        template: |+
          ## 📄 Article Preview

          ### Title
          **{{ title }}**

          ### Content
          {{ field_body.0.value|striptags }}

          ### Summary
          {{ field_body.0.summary }}

          ---

          ## 🔍 SEO Metadata
          **Meta Title:** {{ meta_title }}
          **Meta Description:** {{ meta_description }}

          ---

          **Ready to publish?** Review the content above and confirm to create this article.

        nodeType: simple
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: prompt_template
      extensions:
        ui:
          hideUnconnectedHandles: true
    measured:
      width: 288
      height: 103
  -
    id: confirmation.1
    position:
      x: 2560
      'y': -20
    data:
      label: Confirmation
      config:
        message: 'Do you want to create the article?'
        confirm_label: 'Yes'
        cancel_label: 'No'
        branches:
          -
            name: 'true'
            value: true
          -
            name: 'false'
            value: false
        nodeType: gateway
        instanceTitle: ''
        instanceDescription: ''
        branches-0-name: 'true'
        branches-0-value: true
        branches-1-name: 'false'
        branches-1-value: false
      metadata:
        node_type_id: confirmation
      extensions:
        ui:
          hideUnconnectedHandles: true
    measured:
      width: 288
      height: 250
  -
    id: data_to_json.1
    position:
      x: 3490
      'y': 230
    data:
      label: 'Data to JSON'
      config:
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: data_to_json
      extensions:
        ui:
          hideUnconnectedHandles: true
    measured:
      width: 288
      height: 330
  -
    id: flowdrop_ai_provider_chat.2
    position:
      x: 3980
      'y': 300
    data:
      label: Chat
      config:
        model: mistral-large-latest
        temperature: 0.7
        maxTokens: 1000
        systemPrompt: |-
          Analyze the Drupal article node provided in JSON format and provide feedback on:

          1. SEO METADATA QUALITY:
             - Is the meta title compelling and within 50-60 characters?
             - Does the meta description effectively summarize the content in 150-160 characters?
             - Are there keywords that could improve search visibility?

          2. CONTENT QUALITY:
             - Is the article well-structured and engaging?
             - Does the body content support the meta description?
             - Is the summary accurate?

          3. RECOMMENDATIONS:
             - Suggest improvements for meta title and description
             - Rate overall SEO optimization (1-10)

          Keep feedback concise and actionable.
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: flowdrop_ai_provider_chat
      extensions:
        ui:
          hideUnconnectedHandles: true
    measured:
      width: 288
      height: 330
  -
    id: chat_output.2
    position:
      x: 4490
      'y': 420
    data:
      label: 'Chat Output'
      config:
        format: text
        showTimestamp: false
        nodeType: square
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: chat_output
      extensions:
        ui:
          hideUnconnectedHandles: true
    measured:
      width: 80
      height: 80
  -
    id: entity_save.1
    position:
      x: 3030
      'y': 240
    data:
      label: 'Entity Save'
      config:
        entity_type: node
        bundle: article
        allowed_fields:
          - title
          - field_body
          - field_metatags
        nodeType: default
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: entity_save
      extensions:
        ui:
          hideUnconnectedHandles: true
    measured:
      width: 288
      height: 365
