    source: json_to_data.1
    target: ai_content_validation_improve_gate.1
    sourceHandle: json_to_data.1-output-data
    targetHandle: ai_content_validation_improve_gate.1-input-data
  -
    id: e-chat-gate-rawjson
    source: flowdrop_ai_provider_chat.1
    target: ai_content_validation_improve_gate.1
    sourceHandle: flowdrop_ai_provider_chat.1-output-response
    targetHandle: ai_content_validation_improve_gate.1-input-json
  -
    id: e-gate-normalize
    source: ai_content_validation_improve_gate.1
    target: ai_content_validation_normalize.1
    sourceHandle: ai_content_validation_improve_gate.1-output-data
    targetHandle: ai_content_validation_normalize.1-input-data
