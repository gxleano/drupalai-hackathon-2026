uuid: 109c81ff-1938-47bb-9eb8-7d545ced9c32
langcode: en
status: true
dependencies:
  config:
    # Runtime dependency, not expressible here: the gate node reads
    # flowdrop_workflow.flowdrop_workflow.content_validation_fixer at
    # execution time — that workflow supplies both the baseline report and
    # the validator prompt the candidate is re-scored with. Renaming or
    # deleting content_validation_fixer breaks AI Improve.
    - flowdrop_node_type.flowdrop_node_type.ai_content_validation_improve_gate
    - flowdrop_node_type.flowdrop_node_type.ai_content_validation_normalize
    - flowdrop_node_type.flowdrop_node_type.chat_input
    - flowdrop_node_type.flowdrop_node_type.echack_flowdrop_node_session_content_context
    - flowdrop_node_type.flowdrop_node_type.flowdrop_ai_provider_chat
    - flowdrop_node_type.flowdrop_node_type.flowdrop_node_processor_validation_save
    - flowdrop_node_type.flowdrop_node_type.json_to_data
    - flowdrop_node_type.flowdrop_node_type.prompt_template
id: content_improve
label: 'AI Improve'
description: 'Rewrites an article based on the findings of a previous AI validation: fixes the failing EU guidelines and factual errors, proposing at most one full replacement value per field (title, body, meta tags).'
nodes:
  -
    id: echack_flowdrop_node_session_content_context.1
    position:
      x: 0
      'y': 0
    data:
      label: 'Content Context'
      config:
        is_default_revision: true
        nodeType: default
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: echack_flowdrop_node_session_content_context
      extensions:
        ui:
          hideUnconnectedHandles: true
  -
    id: chat_input.1
    position:
      x: 0
      'y': 300
    data:
      label: 'Validation Findings'
      config: {  }
      metadata:
        node_type_id: chat_input
      extensions:
        ui:
          hideUnconnectedHandles: true
  -
    # The findings arrive as one prose string (AiReviewForm assembles it),
    # but the improver needs the baseline number as its own value, not
    # buried mid-sentence. These two nodes lift it out again so the prompt
    # can state it on its own line. Twig only, no model call.
    id: prompt_template.2
    position:
      x: 0
      'y': 1100
    data:
      label: 'Baseline Score'
      config:
        template: '{%- if "Quality score: " in findings -%}{{ (findings|split("Quality score: ")|last|split("/100")|first|trim)|raw }}{%- else -%}unknown{%- endif -%}'
        dynamicInputs:
          -
            name: findings
            label: Findings
            dataType: string
            description: 'The findings string to read the baseline score out of.'
            required: false
        nodeType: simple
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: prompt_template
      extensions:
        ui:
          hideUnconnectedHandles: false
  -
    id: prompt_template.3
    position:
      x: 0
      'y': 1350
    data:
      label: 'Guideline Verdicts'
      config:
        template: '{%- if "Per-guideline verdicts: " in findings -%}{{ (findings|split("Per-guideline verdicts: ")|last|split(". Concentrate")|first|trim)|raw }}{%- else -%}not reported{%- endif -%}'
        dynamicInputs:
          -
            name: findings
            label: Findings
            dataType: string
            description: 'The findings string to read the per-guideline verdicts out of.'
            required: false
        nodeType: simple
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: prompt_template
      extensions:
        ui:
          hideUnconnectedHandles: false
  -
    id: prompt_template.1
    position:
      x: 400
      'y': 0
    data:
      label: 'Improve Prompt'
      config:
        template: |-
          Improve this article so it fixes the problems found by a previous AI validation. Follow the output format from your instructions exactly.

          Today's date is {{ "now"|date("j F Y") }}. Dates in the article on or around this date are CURRENT — do not change or "correct" them.

          Baseline quality score of the current version: {{ baseline_score|raw }}/100. The improved version is re-scored and must not fall below this number.

          Per-guideline verdicts of the current version: {{ guideline_verdicts|raw }}

          Previous validation findings:
          {{ findings|raw }}

          Article data:
          - id: {{ id }}
          - title: {{ title }}
          - revision id (vid): {{ fields.vid[0].value }}
          - Current Body:
          {% if fields.field_body[0].value is defined and fields.field_body[0].value %}
          {{ fields.field_body[0].value|raw }}
          {% else %}
          [No body content]
          {% endif %}
          - Current Meta Tags: {{ fields.field_metatags[0].value ?? '[No meta tags]' }}
        dynamicInputs:
          -
            name: findings
            label: Findings
            dataType: string
            description: 'Summary of the previous validation.'
            required: false
          -
            name: baseline_score
            label: 'Baseline score'
            dataType: string
            description: 'The quality score the current version already achieved. The gate rejects any proposal that scores below it.'
            required: false
          -
            name: guideline_verdicts
            label: 'Per-guideline verdicts'
            dataType: string
            description: "The current version's per-guideline scores, so the improver can tell what is weak from what already scores well."
            required: false
        nodeType: simple
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: prompt_template
      extensions:
        ui:
          hideUnconnectedHandles: false
  -
    id: flowdrop_ai_provider_chat.1
    position:
      x: 800
      'y': 0
    data:
      label: Chat
      config:
        # Medium, not large: with the full body in the prompt the large
        # model regularly exceeds the provider's 60s HTTP timeout.
        model: mistral-medium-latest
        temperature: 0.3
        maxTokens: 4000
        systemPrompt: |
          You are a JSON generator. Output ONLY valid JSON. No text, no markdown, no code fences, no explanation. Start your response with { and end with }.

          Do not ADD new hyperlinks, URLs, <a> tags, markdown links, or placeholder links (href="#") — name new sources in plain text instead (e.g. "(EFSA, 2023)"). But KEEP every link, source and citation that already exists in the current content: removing them lowers the Source Transparency score.

          YOU ARE AN EDITOR, NOT AN AUTHOR (the single most important rule): you only suggest changes to content that ALREADY EXISTS, to bring it in line with the EU guidelines. You never generate new content and never hallucinate.
          - ALLOWED: rephrasing, restructuring, clarifying, fixing grammar and tone, correcting factual errors the findings name, reorganizing into headings/lists using the existing text, deriving the title and meta tags from the existing body.
          - FORBIDDEN: inventing ANY fact, date, deadline, amount, statistic, name, program edition, historical claim, example, quote or source that is not present in the current content or the findings; adding new sections, claims or details "to improve completeness"; padding thin content with generated material.
          - If a finding can only be fixed by ADDING information that does not exist (e.g. an empty or minimal body, missing details), do NOT write that information. Skip that field entirely and state in the "summary" that the editor must supply it — a human writes content, you only edit it.
          - Keep every factual claim consistent across title, body and meta tags.
          - DATES: never assume the current year from your training data, and never "correct" a date for that reason. The entity timestamps in the input data (created/changed/revision) define "now"; only change a date when the findings name it as contradicting another date or fact within the article itself.
          Every invented specific is flagged as unverifiable at re-validation and caps the Accuracy score at 3/10, wiping out all other improvements.

          TASK:
          You are an expert content editor specializing in European Commission content standards. You receive an article plus the findings of a previous validation against the 10 EU content guidelines (Accuracy & Evidence; Clarity & Plain Language; Neutrality & Objectivity; Source Transparency; Legal & Policy Consistency; Audience Relevance; Structure & Coherence; Completeness & Context; Inclusivity & Language Ethics; Practical Value). Suggest edits to the EXISTING article text so the problems named in the findings are fixed — within the editor-not-author rules above.

          NON-REGRESSION RULE (most important): the improved article will be re-scored against the same 10 guidelines and MUST score at least as high on every guideline as the current version. Change ONLY what a finding requires; preserve everything else verbatim — existing sources, citations, links, headings, structure, facts, examples and level of detail. Never shorten or simplify content that was not flagged. The per-guideline verdicts of the current version are given to you above: focus on the lowest-scoring guidelines and do not touch what scored well. A proposal that re-scores below the baseline score given above is discarded outright, so the whole rewrite is wasted.

          IMPORTANT: Extract these values from the input data: title (the "title" field), nid (the "id" field as an INTEGER), vid (inside "fields" then "vid" then first array element then "value", as an INTEGER).

          Example output format: {"label":"Improve: Article Title Here","status":true,"description":"AI improvement based on validation findings","field_flowdrop_workflow":"content_improve","field_content_revision":{"target_id":123,"target_revision_id":456},"field_validation_status":"pending","field_validation_result":{"score":null,"summary":"One short paragraph listing what was fixed and which findings it addresses.","suggestions":[{"field":"title","label":"Title","current":"exact current value","suggested":"improved full replacement value","reason":"which finding/guideline this fixes"},{"field":"field_body","label":"Body","current":"current HTML","suggested":"full improved HTML content","reason":"..."},{"field":"field_metatags","label":"Meta Tags","current":"current value","suggested":"improved value in exactly the same JSON format as the current value","reason":"..."}]}}

          CRITICAL rules:
          - field_validation_result MUST be a JSON OBJECT with exactly three keys: "score", "summary" and "suggestions".
          - "score" MUST be null (scoring only happens in validation).
          - EXACTLY ONE suggestion per field, never two suggestions for the same field. Allowed fields: "title", "field_body", "field_metatags". Only include a field when the findings require changing it.
          - FIELD-SCOPED EDITS: the findings list a "Per-field findings" section naming, per field, the exact guidelines that failed on that field. A field's suggestion MUST fix every guideline named for THAT field and nothing else. A field with no line in that section is already compliant — OMIT it from "suggestions" entirely, never "polish" it.
          - "reason" MUST name the guideline number(s) it addresses and state, in one sentence, how the NEW value satisfies them — e.g. "Guideline 3 (Neutrality): the promotional wording is replaced with a factual description of the programme." Never restate the problem alone, never write a vague reason like "improved clarity", and never cite a guideline that was not named for that field.
          - NEVER emit a suggestion whose "suggested" value is empty or identical to "current". When you cannot edit a field without inventing content (e.g. the body is missing), OMIT that field from "suggestions" entirely — an empty "suggestions" array is a valid answer — and explain in "summary" what the editor must write.
          - "suggested" MUST be the complete replacement value, not a diff. For field_body use full HTML. For field_metatags the value MUST be a JSON OBJECT mapping tag names to strings (e.g. {"title":"…","description":"…","keywords":"…"}) — NEVER an array of {key, value} pairs — even when the current value is empty.
          - field_validation_status MUST be the string "pending".
          - target_id and target_revision_id MUST be integers (not arrays, not null). If you cannot find the id, use 0.

          OUTPUT ONLY THE JSON. START YOUR RESPONSE WITH { AND END WITH }
        instanceTitle: 'Content Improver AI'
        instanceDescription: ''
      metadata:
        node_type_id: flowdrop_ai_provider_chat
      extensions:
        ui:
          hideUnconnectedHandles: false
  -
    id: json_to_data.1
    position:
      x: 1200
      'y': 0
    data:
      label: 'Parse Improve JSON'
      config:
        parse_mode: tolerant
      metadata:
        node_type_id: json_to_data
  -
    # The non-regression guarantee. The prompt's NON-REGRESSION RULE is a
    # hint; this node is the enforcement: it re-scores the candidate the
    # suggestions would produce with the validator's own prompt and drops
    # the proposal when it scores below the baseline report.
    id: ai_content_validation_improve_gate.1
    position:
      x: 1600
      'y': 0
    data:
      label: 'Gate Improvement'
      config:
        validation_workflow: content_validation_fixer
      metadata:
        node_type_id: ai_content_validation_improve_gate
  -
    id: ai_content_validation_normalize.1
    position:
      x: 2000
      'y': 0
    data:
      label: 'Normalize Values'
      config: {  }
      metadata:
        node_type_id: ai_content_validation_normalize
  -
    id: flowdrop_node_processor_validation_save.1
    position:
      x: 2400
      'y': 0
    data:
      label: 'Save Improvement'
      config:
        entity_type: ai_content_validation_item
      metadata:
        node_type_id: flowdrop_node_processor_validation_save
