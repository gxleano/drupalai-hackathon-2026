    id: e-normalize-save
    source: ai_content_validation_normalize.1
    target: flowdrop_node_processor_validation_save.1
    sourceHandle: ai_content_validation_normalize.1-output-values
    targetHandle: flowdrop_node_processor_validation_save.1-input-values
