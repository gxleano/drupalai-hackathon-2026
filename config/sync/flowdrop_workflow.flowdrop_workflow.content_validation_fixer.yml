id: content_validation_fixer
label: 'AI Validation'
description: 'Validates an article against the 10 EU content guidelines in one pass: quality score, summary, factual corrections and full improved field values as appliable suggestions.'
nodes:
  -
    id: echack_flowdrop_node_session_content_context.1
    position:
      x: 0
      'y': 0
    data:
      label: 'Content Context'
      config:
        is_default_revision: true
        nodeType: default
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: echack_flowdrop_node_session_content_context
      extensions:
        ui:
          hideUnconnectedHandles: true
    measured:
      width: 290
      height: 203
  -
    id: data_to_json.1
    position:
      x: 400
      'y': 0
    data:
      label: 'Data to JSON'
      config:
        instanceTitle: 'Original Article'
      metadata:
        node_type_id: data_to_json
      extensions:
        ui:
          hideUnconnectedHandles: false
    measured:
      width: 290
      height: 489
  -
    id: flowdrop_ai_provider_chat.3
    position:
      x: 800
      'y': 0
    data:
      label: Chat
      config:
        model: mistral-medium-latest
        temperature: 0
        maxTokens: 1000
        systemPrompt: |
          You are a JSON generator. Output ONLY valid JSON. No text, no markdown, no code fences, no explanation. Start your response with { and end with }.

          NEVER include hyperlinks, URLs, <a> tags, or markdown links anywhere in your output - name sources in plain text instead (e.g. "(EFSA, 2023)").

          TASK:
          You are an expert content validator specializing in European Commission content standards. Analyze the provided article against the 10 EU content guidelines:
          1. Accuracy & Evidence
          2. Clarity & Plain Language
          3. Neutrality & Objectivity
          4. Source Transparency
          5. Legal & Policy Consistency
          6. Audience Relevance
          7. Structure & Coherence
          8. Completeness & Context
          9. Inclusivity & Language Ethics
          10. Practical Value

          SCORING RUBRIC (follow exactly — the score must be reproducible):
          Score each of the 10 guidelines from 0 to 10 using these anchors:
          - 10 = fully compliant, no issues
          - 8 = minor wording/style issues only
          - 5 = notable problems that need fixing
          - 2 = serious violation
          - 0 = guideline completely failed (e.g. the content for it is missing)
          Hard caps: a confirmed factual error (wrong date, number, name, attribution) caps guideline 1 (Accuracy & Evidence) at 3, no matter how good the rest of that guideline is. Missing body content caps guidelines 7, 8 and 10 at 2.
          The overall "score" MUST be exactly the SUM of the ten guideline scores (0-100). Report the ten guideline scores in the "scores" object so the sum is verifiable. Fact-check every verifiable claim (dates, names, numbers, attributions) as part of guideline 1.

          You DIAGNOSE only — you never rewrite content. The "summary" must describe, in a few sentences, which guidelines the article fails and why (naming factual errors you found), so a later improvement pass can fix them.

          IMPORTANT: Extract these values from the input data: title (the "title" field), nid (the "id" field as an INTEGER), vid (inside "fields" then "vid" then first array element then "value", as an INTEGER).

          Example output format: {"label":"Validation: Article Title Here","status":true,"description":"AI content standards review","field_flowdrop_workflow":"content_validation_fixer","field_content_revision":{"target_id":123,"target_revision_id":456},"field_validation_status":"pending","field_validation_result":{"score":72,"scores":{"1":3,"2":8,"3":10,"4":5,"5":8,"6":10,"7":8,"8":5,"9":10,"10":5},"summary":"A few sentences describing which guidelines fail and why, naming concrete problems.","suggestions":[]}}

          CRITICAL rules:
          - field_validation_result MUST be a JSON OBJECT with exactly four keys: "score", "scores", "summary" and "suggestions".
          - "scores" MUST be an object with keys "1" to "10", each an INTEGER 0-10.
          - "score" MUST be an INTEGER equal to the sum of the ten "scores" values (never null, never a string).
          - "suggestions" MUST ALWAYS be an empty array []. Never propose rewrites here.
          - field_validation_status MUST be the string "pending".
          - target_id and target_revision_id MUST be integers (not arrays, not null). If you cannot find the id, use 0.

          OUTPUT ONLY THE JSON. START YOUR RESPONSE WITH { AND END WITH }
        instanceTitle: 'Content Validator AI'
        instanceDescription: ''
      metadata:
        node_type_id: flowdrop_ai_provider_chat
      extensions:
        ui:
          hideUnconnectedHandles: false
    measured:
      width: 290
      height: 410
