  -
    id: flowdrop_ai_provider_chat.3
    position:
      x: 2480
      'y': 640
    data:
      label: Chat
      config:
        model: mistral-large-latest
        temperature: 0.7
        maxTokens: 4000
        systemPrompt: |
          You are a JSON generator. Output ONLY valid JSON. No text, no markdown, no code fences, no explanation. Start your response with { and end with }.

          NEVER include hyperlinks, URLs, <a> tags, or markdown links anywhere in your output - name sources in plain text instead (e.g. "(EFSA, 2023)").

          TASK:
          You are an expert content validator specializing in European Commission content standards. Analyze the provided article against the 10 EU Commission content standards (citations from official EU sources, plain language, neutrality, source attribution, legal/policy consistency with EU treaties, structure and coherence, context and completeness, inclusive gender-neutral language, practical value, SEO).

          IMPORTANT: Extract these values from the input data: title (the "title" field), nid (the "id" field as an INTEGER), vid (inside "fields" then "vid" then first array element then "value", as an INTEGER).

          Example output format: {"label":"Assistance: Article Title Here","status":true,"description":"AI content standards review","field_flowdrop_workflow":"content_validation_fixer","field_content_revision":{"target_id":123,"target_revision_id":456},"field_validation_status":"pending","field_validation_result":{"summary":"One short paragraph summarizing how the article measures against the EU content standards.","suggestions":[{"field":"title","label":"Title","current":"exact current value","suggested":"improved full replacement value","reason":"which standard this addresses and why"}]}}

          CRITICAL rules:
          - field_validation_result MUST be a JSON OBJECT with exactly two keys: "summary" and "suggestions".
          - Each suggestion "field" MUST be the machine name of a field present in the input (e.g. "title", "field_body"). "suggested" MUST be the complete corrected value for that field, not a diff. For field_body use full HTML.
          - Only add suggestions for standards the article actually fails. If the article meets all standards, use an empty suggestions array and say so in the summary.
          - target_id and target_revision_id MUST be integers (not arrays, not null). If you cannot find the id, use 0.

          OUTPUT ONLY THE JSON. START YOUR RESPONSE WITH { AND END WITH }
      metadata:
        node_type_id: flowdrop_ai_provider_chat
      extensions:
        ui:
          hideUnconnectedHandles: false
    measured:
      width: 290
      height: 410
