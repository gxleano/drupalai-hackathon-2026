id: content_validation_fixer
label: 'Content Validation Fixer'
description: 'This workflow will fix the content based on demand validation.'
nodes:
  -
    id: echack_flowdrop_node_session_content_context.1
    position:
      x: 0
      'y': -120
    data:
      label: 'Content Context'
      config:
        is_default_revision: true
        nodeType: default
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: echack_flowdrop_node_session_content_context
      extensions:
        ui:
          hideUnconnectedHandles: true
    measured:
      width: 290
      height: 203
  -
    id: flowdrop_ai_provider_chat.2
    position:
      x: 2660
      'y': -340
    data:
      label: Chat
      config:
        model: mistral-large-latest
        temperature: 0.7
        maxTokens: 4000
        systemPrompt: |-
          You are a JSON generator. Output ONLY valid JSON. No text, no markdown, no code fences, no explanation. Start your response with { and end with }.

          NEVER include hyperlinks, URLs, <a> tags, or markdown links anywhere in your output - name sources in plain text instead (e.g. "(EFSA, 2023)").

          TASK:
          You are an expert content editor specializing in European Commission content standards. Rewrite the provided article so it meets all 10 EU Commission content standards (citations from official EU sources, plain language, neutrality, source attribution, legal/policy consistency with EU treaties, structure and coherence, context and completeness, inclusive gender-neutral language, practical value, SEO). Propose the improved values as suggestions - do not describe them, write the full improved values.

          IMPORTANT: Extract these values from the input data: title (the "title" field), nid (the "id" field as an INTEGER), vid (inside "fields" then "vid" then first array element then "value", as an INTEGER).

          Example output format: {"label":"Assistance (Improve): Article Title Here","status":true,"description":"AI content improvement","field_flowdrop_workflow":"content_validation_fixer","field_content_revision":{"target_id":123,"target_revision_id":456},"field_validation_status":"pending","field_validation_result":{"summary":"One short paragraph describing the improvements made.","suggestions":[{"field":"title","label":"Title","current":"exact current value","suggested":"improved full replacement value","reason":"which standard this addresses and why"},{"field":"field_body","label":"Body","current":"current HTML","suggested":"full improved HTML content","reason":"..."}]}}

          CRITICAL rules:
          - field_validation_result MUST be a JSON OBJECT with exactly two keys: "summary" and "suggestions".
          - Each suggestion "field" MUST be the machine name of a field present in the input (e.g. "title", "field_body"). "suggested" MUST be the complete improved value for that field, not a diff. For field_body use full HTML.
          - target_id and target_revision_id MUST be integers (not arrays, not null). If you cannot find the id, use 0.

          OUTPUT ONLY THE JSON. START YOUR RESPONSE WITH { AND END WITH }
        instanceTitle: 'Content Improver AI'
        instanceDescription: ''
      metadata:
        node_type_id: flowdrop_ai_provider_chat
      extensions:
        ui:
          hideUnconnectedHandles: false
    measured:
      width: 290
      height: 410
  -
    id: prompt_template.3
    position:
      x: 2240
      'y': -80
    data:
      label: 'Prompt Template'
      config:
        template: |-
          Improve this article according to EU Commission content standards. Follow the output format from your instructions exactly.

          Article data (JSON):
          - id: {{ id }}
          - title: {{ title }}
          - revision id (vid): {{ fields.vid[0].value }}
          - Current Body:
          {% if field_body %}
          {{ field_body[0].value|raw }}
          {% else %}
          [No body content]
          {% endif %}
          - Current Meta Tags: {{ field_metatags }}
        nodeType: simple
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: prompt_template
      extensions:
        ui:
          hideUnconnectedHandles: false
    measured:
      width: 290
      height: 106
  -
    id: choice_input.1
    position:
      x: 940
      'y': 120
    data:
      label: 'Choice Input'
      config:
        message: ''
        options:
          -
            value: validate
            label: 'Run Validation'
            description: ''
          -
            value: improve
            label: 'Improve Article'
            description: ''
        multiple: false
        min_selections: 1
        nodeType: default
        instanceTitle: 'Ask User what they want to do'
        instanceDescription: 'Validate, or Improve?'
      metadata:
        node_type_id: choice_input
      extensions:
        ui:
          hideUnconnectedHandles: true
    measured:
      width: 290
      height: 272
  -
    id: prompt_template.6
    position:
