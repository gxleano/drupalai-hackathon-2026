id: content_validation_fixer
label: 'AI Validation'
description: 'Validates an article against the 10 EU content guidelines in one pass: quality score, summary, factual corrections and full improved field values as appliable suggestions.'
nodes:
  -
    id: echack_flowdrop_node_session_content_context.1
    position:
      x: 0
      'y': 0
    data:
      label: 'Content Context'
      config:
        is_default_revision: true
        nodeType: default
        instanceTitle: ''
        instanceDescription: ''
      metadata:
        node_type_id: echack_flowdrop_node_session_content_context
      extensions:
        ui:
          hideUnconnectedHandles: true
    measured:
      width: 290
      height: 203
  -
    id: ai_content_validation_payload.1
    position:
      x: 400
      'y': 0
    data:
      label: 'Validator Payload'
      config:
        instanceTitle: 'Original Article'
      metadata:
        node_type_id: ai_content_validation_payload
      extensions:
        ui:
          hideUnconnectedHandles: false
    measured:
      width: 290
      height: 489
  -
    id: flowdrop_ai_provider_chat.3
    position:
      x: 800
      'y': 0
    data:
      label: Chat
      config:
        model: mistral-medium-latest
        temperature: 0
        maxTokens: 2000
        systemPrompt: |
          You are a JSON generator. Output ONLY valid JSON. No text, no markdown, no code fences, no explanation. Start your response with { and end with }.

          NEVER include hyperlinks, URLs, <a> tags, or markdown links anywhere in your output - name sources in plain text instead (e.g. "(EFSA, 2023)").

          TASK:
          ASSESSED FIELDS: the user message OPENS with a line beginning "ASSESSED FIELDS" that names every field you must report on, with its label. Read that line first and use exactly those key names — no more, no fewer. It is authoritative: never assess a field it omits, never skip one it names, and never fall back to a field list you saw in an example. A field marked "assess only" is judged like any other but you never propose a replacement value for it.
          You are an expert content validator specializing in European Commission content standards. You only ASSESS: you judge strictly the content you are given and produce a score. You never rewrite, add, assume or invent content — findings must reference only text that is actually present in the provided article (quote or name the exact problem), never content you imagine it should have. Analyze the provided article against the 10 EU content guidelines:
          1. Accuracy & Evidence
          2. Clarity & Plain Language
          3. Neutrality & Objectivity
          4. Source Transparency
          5. Legal & Policy Consistency
          6. Audience Relevance
          7. Structure & Coherence
          8. Completeness & Context
          9. Inclusivity & Language Ethics
          10. Practical Value

          SCORING RUBRIC (follow exactly — the verdicts must be reproducible):
          Do NOT produce numbers. For each of the 10 guidelines give exactly ONE VERDICT string:
          - "pass" = compliant, nothing worth fixing
          - "minor" = only small wording/style issues
          - "major" = concrete problems that need fixing (name them in the summary)
          - "fail" = guideline not met at all (e.g. the content for it is missing)
          Judge each guideline independently and decisively; when torn between two verdicts on identical evidence, pick the SAME verdict you would pick again tomorrow — verdicts must be reproducible for unchanged content.
          Hard rules: a CONFIRMED factual error makes guideline 1 (Accuracy & Evidence) at most "major". Confirmed means the article contradicts itself (two different dates for the same event, numbers that do not add up, a name attributed inconsistently). List every confirmed contradiction in the "contradictions" array, quoting both conflicting statements. This applies ONLY when "contradictions" is non-empty; when it is empty, guideline 1 MUST be "pass" or "minor". A claim that merely LACKS a source is NOT a factual error and never goes into "contradictions" — judge it under guideline 4 (Source Transparency) instead. Missing body content makes guidelines 7, 8 and 10 "fail".
          SOURCES AND LINKS: embedded hyperlinks to official sources COUNT as valid source attribution for guideline 4 — never penalize content for using links instead of plain-text citations. Guideline 4 is about whether claims name where they come from (link, citation or named institution), not about the citation format.
          DATES: never assume the current year from your training data. The entity timestamps in the input data (created/changed/revision) define "now" — dates in the article that are consistent with those timestamps are current, NOT future, and NOT factual errors. Only flag a date as an error when it contradicts another date or fact within the article itself.
          Set "score" to null — the system computes the 0-100 score from your verdicts. Report the ten verdicts in the "scores" object. Fact-check every verifiable claim (dates, names, numbers, attributions) as part of guideline 1.

          You DIAGNOSE only — you never rewrite content. Report your findings in three places: one entry per field in "field_findings", one explicit verdict per field in "field_verdicts", plus the overall closing assessment in "summary".
          PER-FIELD VERDICTS: "field_verdicts" MUST be a JSON object with EXACTLY ONE KEY PER FIELD NAMED IN THE "ASSESSED FIELDS" LINE — each the string "pass" or "review". "review" means the field has AT LEAST ONE problem an editor should act on (any error, typo, nonsensical text, guideline violation or inconsistency you mention in that field's finding); "pass" means the field is fine as it stands. The verdict is THE machine-read decision — the UI badges each field from it, never from the finding prose — so the verdict and the finding MUST agree: if the finding states any problem, the verdict MUST be "review"; a "pass" verdict may only sit next to an affirmative finding (an optional non-binding improvement idea is still "pass").
          PER-FIELD FINDINGS: "field_findings" MUST be a JSON object with EXACTLY ONE KEY PER FIELD NAMED IN THE "ASSESSED FIELDS" LINE, and EVERY one of them MUST be present on EVERY run, including when a field has no problems. Each value is a short plain-text string of one or two sentences about THAT field only. ATTRIBUTION RULE: judge each field STRICTLY on its own text — a problem that lives in another field's text (e.g. a nonsensical token inside the meta tags title) belongs to THAT field's finding alone and must never be repeated in, or flip the verdict of, any other field. Before writing a finding, verify the quoted problem text actually occurs in THIS field's value. When the field has a problem, state it and name the guideline number(s) responsible (e.g. "Guideline 4: the 2023 figure names no source."). CONSISTENCY RULE: a field finding may cite "Guideline N" ONLY when your "scores" verdict for guideline N is minor, major or fail — the reviewer UI treats any cited guideline number as an actionable problem, so citing one next to an all-pass verdict contradicts yourself. When the field has no problems, do NOT omit the key — say so affirmatively (e.g. "Accurate and specific.") and you MAY add one non-binding improvement idea, phrased WITHOUT any guideline number. A field that is unchanged since the findings you would have reported last time must get the same finding again — do not surface an improvement idea on one run and drop it on the next. Never use null, never leave a value empty, and never include hyperlinks, URLs or markdown links in these strings.
          The "summary" must describe the article AS A WHOLE in a few sentences — the overall closing assessment — and MUST still name the concrete problems you found (which guidelines the article fails and why, naming factual errors), so a later improvement pass can fix them.

          IMPORTANT: Extract these values from the input data: title (the "title" field), nid (the "id" field as an INTEGER), vid (inside "fields" then "vid" then first array element then "value", as an INTEGER).

          The example below shows the JSON SHAPE with only two fields, to keep it short. Your own "field_findings" and "field_verdicts" MUST cover every field from the "ASSESSED FIELDS" line, not just these two.
          Example output format: {"label":"Validation: Article Title Here","status":true,"description":"AI content standards review","field_flowdrop_workflow":"content_validation_fixer","field_content_revision":{"target_id":123,"target_revision_id":456},"field_validation_status":"pending","field_validation_result":{"score":null,"scores":{"1":"major","2":"minor","3":"pass","4":"major","5":"minor","6":"pass","7":"minor","8":"major","9":"pass","10":"major"},"contradictions":["Body says the deadline is 31 May 2024 but the meta tags say 30 November 2024"],"field_findings":{"title":"Guideline 3: the title is promotional rather than neutral.","field_body":"Guidelines 1 and 8: the stated deadline conflicts with the meta tags and no legal basis is given."},"field_verdicts":{"title":"review","field_body":"review"},"summary":"A few sentences assessing the article as a whole, naming concrete problems.","suggestions":[]}}

          CRITICAL rules:
          - field_validation_result MUST be a JSON OBJECT with exactly seven keys: "score", "scores", "contradictions", "field_findings", "field_verdicts", "summary" and "suggestions".
          - "contradictions" MUST be an array of strings, each quoting two statements in the article that conflict. Empty array [] when the article does not contradict itself.
          - NOT contradictions (never list these): a budget, figure or event for the current year mentioned during that same year; a deadline or announcement later in the current year; approximate versus exact figures; a claim that is merely unverifiable or unsourced.
          - Both sides of a contradiction MUST be quotes from the article text itself (title, body or meta tags). The publication date, revision timestamps or your assumptions about "now" can NEVER form one side of a contradiction, and a date being in the current or a future year is NEVER a contradiction.
          - "scores" MUST be an object with keys "1" to "10", each one of the strings "pass", "minor", "major" or "fail".
          - "score" MUST be null — the system derives the number from the verdicts.
          - "field_findings" MUST be an object keyed by the fields named in the "ASSESSED FIELDS" line, each a non-empty string. Every one of them MUST be present on every run, even a field with no problems.
          - "field_verdicts" MUST be an object keyed by the fields named in the "ASSESSED FIELDS" line, each the string "pass" or "review". Every one of them MUST be present on every run. Any problem stated in a field's finding makes that field's verdict "review".
          - "suggestions" MUST ALWAYS be an empty array []. Never propose rewrites here.
          - field_validation_status MUST be the string "pending".
          - target_id and target_revision_id MUST be integers (not arrays, not null). If you cannot find the id, use 0.

          OUTPUT ONLY THE JSON. START YOUR RESPONSE WITH { AND END WITH }
        instanceTitle: 'Content Validator AI'
        instanceDescription: ''
      metadata:
        node_type_id: flowdrop_ai_provider_chat
      extensions:
        ui:
          hideUnconnectedHandles: false
    measured:
      width: 290
      height: 410
